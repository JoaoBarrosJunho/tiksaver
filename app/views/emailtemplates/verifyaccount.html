<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account verification</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: sans-serif;

        }
        .title{
            background: #bb89bd;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: sans-serif;
        }

        .description{
            text-align: left;
            
            margin: 20px 0px;
            padding: 0 20px;
        }

        .code{
            background-color: #bb89bd;
            color: #fff;
            font-size: 25px;
            font-weight: bold;
            max-width: 120px;
            width: 100%;
            text-align: center;
            margin: auto;
            border-radius: 9px;
            padding: 5px 5px;

        }

        .message{
            padding: 10px;
            margin: 5px;
            border: #acacac solid 1px ;
            border-radius: 9px;
        }

    </style>
</head>
<body>
    <h1 class="title">Account email verification</h1>
    <div class="message">
    <p class="description">A new <b>@sitename</b> account has been created using the email <b>@Tomail</b>.
    <br><br>
            Confirm your email <b>@Tomail</b> with the code below:</p>
    <p class="code">@code</p>

    <p class="description">If you haven't created an account, just ignore this email.</p>
</div>
</body>
</html>
